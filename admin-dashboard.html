<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Cafe Sierra</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><section class="section" style="padding-top:50px" id="stats"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h2>📊 Owner Dashboard</h2><button class="btn" onclick="logout()">Logout</button></div><p id="demoNote" style="display:none;background:#3a2a10;padding:12px;border-radius:10px">Demo mode — login via Supabase Auth for full CRUD security.</p><div class="grid" style="margin:22px 0"><div class="review"><h3 id="statMenu">-</h3><p>Total Menu Items</p></div><div class="review"><h3 id="statOrders">-</h3><p>Orders</p></div><div class="review"><h3 id="statMsg">-</h3><p>Messages</p></div></div><h3>Add Menu Item</h3><form id="addForm"><input name="name" placeholder="Name" required><input name="category" placeholder="Category (Coffee/Pizza/Pasta...)" required><input name="price" type="number" placeholder="Price PKR" required><input name="image_url" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><button class="btn">Add Item</button></form><h3 style="margin-top:30px">Manage Menu</h3><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody id="menuTable"></tbody></table></div><p style="margin-top:20px"><a href="index.html">View Website →</a></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/admin.js"></script></body></html>
